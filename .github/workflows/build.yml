name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Logik-Tests
        run: |
          mkdir -p out
          javac -d out $(find src/main/java/de/hugoprices/logic src/test -name '*.java')
          java -cp out de.hugoprices.logic.LogicTest
      - name: Mod bauen
        run: |
          set +e
          gradle build --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "What went wrong|Could not|error:|FAILED|Caused by|not found|Unsupported|No matching|Plugin" build.log | head -9 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: cripzys-hugo-preise
          path: build/libs/*.jar
      - name: Fertige Mod ins Repository legen
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p download
          rm -f download/*.jar
          cp $(ls build/libs/*.jar | grep -v -- '-sources') download/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add download
          git diff --cached --quiet || (git commit -m "Fertige Mod [skip ci]" && git push)
