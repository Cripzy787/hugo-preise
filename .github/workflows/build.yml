name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Logik-Tests
        run: |
          mkdir -p out
          javac -d out $(find src/main/java/de/hugoprices/logic src/test -name '*.java')
          java -cp out de.hugoprices.logic.LogicTest
      - name: Mod bauen
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: cripzys-hugo-preise
          path: build/libs/*.jar
